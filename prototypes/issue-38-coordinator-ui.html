<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Issue #38 · Automode Coordinator web dashboard prototype</title>
  <style>
    :root{color-scheme:dark;--bg:#080d17;--panel:#0f172a;--panel2:#111c31;--line:#334155;--text:#f8fafc;--muted:#94a3b8;--dim:#64748b;--accent:#60a5fa;--good:#4ade80;--warn:#fbbf24;--bad:#fb7185;--focus:#93c5fd;--shadow:0 20px 70px #0009}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 0,#15233d 0,transparent 35%),var(--bg);color:var(--text);font:14px/1.45 "Cascadia Code","JetBrains Mono",ui-monospace,SFMono-Regular,Consolas,monospace}
    button,select{font:inherit;color:inherit} button{cursor:pointer}.shell{max-width:1440px;margin:auto;padding:24px 24px 104px}.eyebrow{color:var(--accent);letter-spacing:.12em;font-size:12px;font-weight:700}.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:20px}.topbar h1{margin:5px 0 0;font-size:clamp(20px,3vw,34px);letter-spacing:-.04em}.question{max-width:620px;color:var(--muted);text-align:right}
    .frame{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#0b1220dd;box-shadow:var(--shadow)}.chrome{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 14px;border-bottom:1px solid var(--line);background:#0c1424}.dots{display:flex;gap:6px}.dots i{display:block;width:8px;height:8px;border-radius:50%;background:var(--dim)}.prototype-tag{font-size:12px;color:var(--warn)}
    .run{padding:16px 18px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1.7fr) repeat(4,minmax(92px,.45fr));gap:14px;align-items:center}.repo strong{display:block;font-size:16px}.repo span,.metric span{color:var(--muted);font-size:12px}.metric strong{display:block;margin-top:3px;font-size:14px}.state{font-weight:800}.active,.empty,.recovered,.settled,.running{color:var(--good)}.loading,.degraded,.draining,.waiting,.retrying,.claimed{color:var(--warn)}.queued{color:var(--accent)}.blocked,.human-owned{color:#c4b5fd}.exhausted,.failed{color:var(--bad)}
    .stage-strip{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}.stage-strip b{font-size:11px;padding:2px 7px;border:1px solid #31507b;border-radius:999px;color:#bfdbfe;background:#172554}.context-note{padding:10px 18px;color:var(--muted);border-bottom:1px solid var(--line);background:#0a111e}.view{min-height:500px;padding:18px}.section-title{margin:0 0 10px;color:var(--accent);font-size:12px;letter-spacing:.11em}.badge{display:inline-block;min-width:74px;padding:3px 7px;border:1px solid currentColor;border-radius:5px;text-align:center;font-size:11px;font-weight:800}.muted{color:var(--muted)}
    .deck{display:grid;grid-template-columns:minmax(420px,1.25fr) minmax(300px,.75fr);gap:18px}.roster,.details,.lane,.exception,.timeline{border:1px solid var(--line);background:var(--panel);border-radius:9px;overflow:hidden}.panel-head{padding:10px 12px;border-bottom:1px solid var(--line);font-size:12px;color:var(--accent);letter-spacing:.08em}.ticket-row{width:100%;display:grid;grid-template-columns:82px 86px 100px 1fr;gap:8px;text-align:left;padding:10px 12px;border:0;border-bottom:1px solid #1e293b;background:transparent}.ticket-row:hover,.ticket-row[aria-selected="true"]{background:#17233a}.ticket-row:focus-visible,.control:focus-visible,.switcher button:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}.ticket-row small{display:block;color:var(--muted);margin-top:2px}.details dl{display:grid;grid-template-columns:96px 1fr;gap:10px;margin:0;padding:14px}.details dt{color:var(--muted)}.details dd{margin:0}.isolation{margin:0 14px 14px;padding:10px;border-left:2px solid var(--accent);background:#0b1425;color:var(--muted)}
    .lanes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.lane{min-height:360px}.lane.stage-off{opacity:.72}.lane-head{padding:12px;border-bottom:1px solid var(--line)}.lane-title{display:flex;align-items:center;justify-content:space-between;gap:8px}.stage-toggle{border:1px solid var(--good);border-radius:999px;background:#0b2118;color:var(--good);padding:4px 9px;font-size:11px;font-weight:800}.stage-toggle[data-mode="draining"]{border-color:var(--warn);background:#291f08;color:var(--warn)}.stage-toggle[data-mode="off"]{border-color:var(--dim);background:#172033;color:var(--muted)}.lane-head span{display:block;color:var(--muted);font-size:11px;margin-top:3px}.card{display:block;width:calc(100% - 20px);margin:10px;padding:11px;border:1px solid #2b3c56;border-radius:7px;background:var(--panel2);color:var(--text);text-align:left}.card:hover{border-color:#52729e;background:#15223a}.card:focus-visible{outline:2px solid var(--focus);outline-offset:2px}.card strong{display:block;margin:7px 0 3px}.card small{display:block;color:var(--muted)}.card .why{margin-top:8px;padding-top:8px;border-top:1px solid #26354c;color:#bfdbfe;font-size:11px}.lane-summary{display:flex;flex-wrap:wrap;gap:8px;margin-top:7px;color:var(--muted);font-size:11px}.lane-summary b{color:var(--text)}
    .pulse{display:grid;grid-template-columns:minmax(300px,.72fr) minmax(420px,1.28fr);gap:18px}.exception{padding:12px}.exception-item{padding:12px;border:1px solid #4d2f3b;background:#21131b;border-radius:7px}.clear{padding:22px;text-align:center;color:var(--good)}.timeline-list{list-style:none;margin:0;padding:4px 14px 14px}.timeline-list li{display:grid;grid-template-columns:76px 56px 1fr;gap:10px;padding:11px 0;border-bottom:1px solid #1e293b}.timeline-list time{color:var(--dim)}
    .empty-state{display:grid;place-items:center;min-height:380px;text-align:center}.empty-state strong{font-size:20px}.empty-state p{color:var(--muted);max-width:640px}.controls{position:sticky;bottom:72px;z-index:4;display:flex;flex-wrap:wrap;gap:9px;padding:12px 18px;border:1px solid var(--line);border-inline:0;background:#0a111ef5;backdrop-filter:blur(10px)}.control{border:1px solid var(--line);background:#111c31;border-radius:6px;padding:7px 10px}.control:hover{border-color:var(--accent)}.control.danger{color:#fecdd3;border-color:#6b3040}.notice{margin-left:auto;align-self:center;color:var(--warn);font-size:12px}
    .switcher{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:10;display:none;align-items:center;gap:8px;padding:8px;border:1px solid #51647f;border-radius:999px;background:#0b1220f5;box-shadow:0 12px 40px #000b;backdrop-filter:blur(12px)}.switcher button{border:0;border-radius:999px;background:#1e293b;padding:9px 13px}.switcher button:hover{background:#334155}.switcher output{min-width:210px;text-align:center;font-weight:800}.state-picker{position:fixed;right:22px;bottom:24px;z-index:9;background:#0b1220;border:1px solid var(--line);border-radius:8px;padding:8px 10px}.state-picker label{color:var(--muted);font-size:12px}.state-picker select{border:0;background:transparent;margin-left:5px}.drawer-backdrop{position:fixed;inset:0;z-index:20;background:#020617a8;backdrop-filter:blur(3px)}.drawer{position:absolute;inset:12px 12px 12px auto;width:min(680px,calc(100% - 24px));display:flex;flex-direction:column;border:1px solid #526681;border-radius:12px;background:#0b1220;box-shadow:var(--shadow);overflow:hidden}.drawer-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;padding:16px 18px;border-bottom:1px solid var(--line)}.drawer-head h2{margin:4px 0 0;font-size:20px}.drawer-close{border:1px solid var(--line);border-radius:6px;background:#172033;padding:7px 10px}.drawer-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px 18px;border-bottom:1px solid var(--line)}.drawer-meta span{color:var(--muted);font-size:11px}.drawer-meta strong{display:block;margin-top:3px}.session-feed{overflow:auto;padding:16px 18px}.attempt{margin-bottom:18px;border:1px solid var(--line);border-radius:8px;overflow:hidden}.attempt-head{display:flex;justify-content:space-between;padding:9px 11px;background:#111c31;color:var(--muted)}.feed-row{display:grid;grid-template-columns:74px 70px 1fr;gap:10px;padding:10px 11px;border-top:1px solid #1e293b}.feed-row time{color:var(--dim)}.feed-row b{color:var(--accent)}.feed-row.tool b{color:var(--warn)}.feed-row.error b{color:var(--bad)}.feed-row p{margin:0}.live-dot{color:var(--good)}.no-session{display:grid;place-items:center;min-height:300px;text-align:center;color:var(--muted)}
    @media(max-width:1200px){.run{grid-template-columns:1fr 1fr 1fr}.repo{grid-column:1/-1}.deck,.pulse{grid-template-columns:1fr}.lanes{grid-template-columns:1fr 1fr}.view{min-height:650px}.question{text-align:left}.topbar{align-items:flex-start;flex-direction:column}.notice{width:100%;margin:0}.state-picker{left:16px;right:auto;bottom:22px}}
    @media(max-width:680px){.shell{padding:16px 12px 150px}.run{grid-template-columns:1fr 1fr}.metric:last-child{grid-column:1/-1}.view{padding:12px 12px 140px;min-height:700px}.lanes{grid-template-columns:1fr}.ticket-row{grid-template-columns:72px 76px 1fr}.ticket-row .stage-cell{display:none}.switcher{bottom:76px;width:calc(100% - 24px);justify-content:center}.switcher output{min-width:0;flex:1}.state-picker{display:none}.timeline-list li{grid-template-columns:66px 46px 1fr}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar"><div><div class="eyebrow">THROWAWAY WEB PROTOTYPE · ISSUE #38</div><h1>Automode Coordinator dashboard</h1></div><div class="question">Complete Stage Lane visibility for active, queued, blocked, exhausted, and human-owned candidates.</div></header>
    <section class="frame" aria-label="Automode Coordinator prototype">
      <div class="chrome"><div class="dots"><i></i><i></i><i></i></div><span>localhost · Automode Main — Full-Auto</span><span class="prototype-tag">SIMULATED DATA</span></div>
      <div id="app"></div>
    </section>
  </main>
  <nav class="switcher" aria-label="Prototype variants"><button id="previous" aria-label="Previous variant">←</button><output id="variantLabel"></output><button id="next" aria-label="Next variant">→</button></nav>
  <div class="state-picker"><label for="scenario">Lifecycle state</label><select id="scenario"></select></div>
<script>
const variants=[['deck','Command Deck'],['lanes','Stage Lanes'],['pulse','Pulse + Exceptions']];
const scenarios=['loading','empty','active','degraded','draining','exhausted','recovered'];
const base=[
 {ref:'#68',title:'Crash after reopening a linked worktree',stage:'Auto-Triage',state:'queued',attempt:0,activity:'needs-triage · unassigned',why:'Eligible now; waiting for Coordinator claim',session:'Not created',workspace:'repository root (read-only)'},
 {ref:'#71',title:'Support enterprise proxy settings',stage:'Auto-Triage',state:'human-owned',attempt:0,activity:'needs-triage · assigned to maintainer',why:'Visible candidate, but Automode will not take a human-owned issue',session:'Not created',workspace:'repository root (read-only)'},
 {ref:'#52',title:'Clarify retention policy',stage:'Auto-Grilling',state:'running',attempt:1,activity:'Grilling Round 2 · 3/3 Panel Answers received',why:'Authoritative Grilling Session is synthesizing final answers',session:'grilling-52-a91f',workspace:'repository root (read-only)'},
 {ref:'#54',title:'Choose recovery conflict policy',stage:'Auto-Grilling',state:'queued',attempt:0,activity:'frontier · unassigned · unblocked',why:'Eligible now; ahead of the next 30-second dispatch scan',session:'Not created',workspace:'repository root (read-only)'},
 {ref:'#55',title:'Set artifact retention window',stage:'Auto-Grilling',state:'blocked',attempt:0,activity:'blocked by open decision #48',why:'Will become eligible when every native blocker closes',session:'Not created',workspace:'repository root (read-only)'},
 {ref:'#57',title:'Add recovery bookkeeping',stage:'Auto-Implement',state:'running',attempt:2,activity:'Focused tests running (01:14)',why:'Persistent Ticket Session owns the item',session:'implement-57-b773',workspace:'.worktree/issue-57'},
 {ref:'#65',title:'Surface failed startup probes',stage:'Auto-Implement',state:'queued',attempt:0,activity:'ready-for-agent · no output pull request',why:'Eligible now; waiting for Coordinator claim',session:'Not created',workspace:'Not created'},
 {ref:'#66',title:'Persist tracker snapshot hashes',stage:'Auto-Implement',state:'claimed',attempt:1,activity:'assigned · creating deterministic worktree',why:'Claimed; Ticket Session startup is in progress',session:'implement-66-starting',workspace:'.worktree/issue-66'},
 {ref:'#67',title:'Add cross-worktree recovery test',stage:'Auto-Implement',state:'blocked',attempt:0,activity:'ready-for-agent · blocked by #60',why:'Automode keeps it visible but cannot dispatch it',session:'Not created',workspace:'Not created'},
 {ref:'#69',title:'Refactor stage naming',stage:'Auto-Implement',state:'human-owned',attempt:0,activity:'ready-for-agent · assigned to another developer',why:'Visible candidate, but Automode will not take human-owned work',session:'Not created',workspace:'Existing human branch'},
 {ref:'PR #61',title:'Harden tracker snapshot parsing',stage:'Auto-Review',state:'running',attempt:1,activity:'Review Round 1 · 2/3 reports',why:'Waiting for the third required attributable report',session:'review-61-c04e',workspace:'.worktree/pr-61'},
 {ref:'PR #64',title:'Add Coordinator event stream',stage:'Auto-Review',state:'queued',attempt:0,activity:'open · non-draft · mergeable',why:'Eligible now; waiting for independent Review Session dispatch',session:'Not created',workspace:'Not resolved'},
 {ref:'PR #70',title:'Document capability attestation',stage:'Auto-Review',state:'queued',attempt:0,activity:'open · non-draft · checks pending',why:'Eligible; checks do not prevent review dispatch',session:'Not created',workspace:'Not resolved'}
];
const failure={ref:'#49',title:'Repair Windows PTY shutdown',stage:'Auto-Implement',state:'retrying',attempt:4,activity:'Process exited 1; retry in 18s',session:'implement-49-77dd',workspace:'.worktree/issue-49'};
let variant=(new URLSearchParams(location.search).get('variant')||'lanes'); if(!variants.some(v=>v[0]===variant))variant='lanes';
let scenario=(new URLSearchParams(location.search).get('state')||'active'); if(!scenarios.includes(scenario))scenario='active';
let selected=0,notice='',detailRef=null;
const stageModes={'Auto-Triage':'on','Auto-Grilling':'on','Auto-Implement':'on','Auto-Review':'on'};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function tickets(){if(['loading','empty'].includes(scenario))return[];if(scenario==='degraded')return[failure,...base];if(scenario==='exhausted')return[{...failure,state:'failed',attempt:5,activity:'Attempt budget exhausted; evidence preserved'},...base];if(scenario==='recovered')return[{...failure,state:'running',activity:'Resumed existing session after Coordinator restart'},...base];return base}
function description(){return {loading:'Taking the startup eligibility snapshot; no claims permitted yet.',empty:'No eligible work. Polling continues every 30 seconds.',active:'Discovery is live and unrelated Ticket Sessions run independently.',degraded:'One item is retrying; unrelated work continues.',draining:'Discovery stopped after first Ctrl-C; active sessions may settle.',exhausted:'One item reached five attempts and retains diagnostics.',recovered:'Coordinator restarted and reconstructed active work best-effort.'}[scenario]}
function badge(s){return `<span class="badge ${s}">${esc(s.toUpperCase())}</span>`}
function header(){const ts=tickets(),active=ts.filter(t=>['running','waiting','claimed'].includes(t.state)).length,queued=ts.filter(t=>t.state==='queued').length,held=ts.filter(t=>['blocked','human-owned'].includes(t.state)).length,failed=ts.filter(t=>t.state==='failed').length;return `<div class="run"><div class="repo"><strong>sz-pi-auto-mode</strong><span>github.com/stanley50z/sz-pi-auto-mode</span><div class="stage-strip">${Object.entries(stageModes).map(([stage,mode])=>`<b>${stage.replace('Auto-','')} · ${mode.toUpperCase()}</b>`).join('')}</div></div><div class="metric"><span>Run identity</span><strong>amr-…-7f31</strong></div><div class="metric"><span>Discovery</span><strong>${scenario==='draining'?'stopped':scenario==='loading'?'snapshotting':'next in 12s'}</strong></div><div class="metric"><span>Lifecycle</span><strong class="state ${scenario}">${scenario.toUpperCase()}</strong></div><div class="metric"><span>Stage candidates</span><strong>${ts.length} open · ${active} active · ${queued} queued · ${held} held · ${failed} exhausted</strong></div></div><div class="context-note">${description()} The board includes every open stage candidate, including work Automode cannot pick up yet.</div>`}
function detail(t){if(!t)return'';return `<section class="details"><div class="panel-head">SELECTED TICKET SESSION</div><dl><dt>Item</dt><dd>${esc(t.ref)} · ${esc(t.title)}</dd><dt>Stage</dt><dd>${esc(t.stage)}</dd><dt>Lifecycle</dt><dd>${badge(t.state)} · attempt ${t.attempt}/5</dd><dt>Activity</dt><dd>${esc(t.activity)}</dd><dt>Session</dt><dd>${esc(t.session)}</dd><dt>Workspace</dt><dd>${esc(t.workspace)}</dd></dl><p class="isolation">Inspect opens the durable Ticket Session separately. Its transcript is never injected into Main Session context.</p></section>`}
function empty(){return `<div class="empty-state"><div><strong class="${scenario}">${scenario==='loading'?'DISCOVERING WORK':'QUEUE CLEAR'}</strong><p>${scenario==='loading'?'Comparing issue, dependency, assignee, pull-request, and updated-at snapshots.':'Automode is healthy. New tracker changes trigger a full enabled-stage scan.'}</p></div></div>`}
function deck(){const ts=tickets();if(!ts.length)return empty();return `<div class="deck"><section class="roster"><div class="panel-head">TICKET SESSIONS · PERSISTENT ROSTER</div>${ts.map((t,i)=>`<button class="ticket-row" data-select="${i}" aria-selected="${i===selected}"><span>${esc(t.ref)}</span>${badge(t.state)}<span class="stage-cell muted">${esc(t.stage.replace('Auto-',''))}</span><span>${esc(t.title)}<small>${esc(t.activity)}</small></span></button>`).join('')}</section>${detail(ts[selected])}</div>`}
function lanes(){const ts=tickets();return `<div class="lanes">${['Auto-Triage','Auto-Grilling','Auto-Implement','Auto-Review'].map(stage=>{const items=ts.filter(t=>t.stage===stage),active=items.filter(t=>['running','waiting','claimed'].includes(t.state)).length,queued=items.filter(t=>t.state==='queued').length,held=items.filter(t=>['blocked','human-owned'].includes(t.state)).length,mode=stageModes[stage];return `<section class="lane ${mode==='off'?'stage-off':''}"><div class="lane-head"><div class="lane-title"><span>${stage.toUpperCase()}</span><button class="stage-toggle" data-stage-toggle="${stage}" data-mode="${mode}" aria-label="${mode==='on'?'Disable':mode==='off'?'Enable':'Cancel drain for'} ${stage}">${mode.toUpperCase()}</button></div><div class="lane-summary"><span><b>${items.length}</b> candidates</span><span><b>${active}</b> active</span><span><b>${queued}</b> queued</span><span><b>${held}</b> held</span></div></div>${items.length?items.map(t=>`<button class="card" data-card-ref="${esc(t.ref)}" aria-label="Inspect ${esc(t.ref)} ${esc(t.title)}">${badge(t.state)}<strong>${esc(t.ref)} · ${esc(t.title)}</strong><small>${esc(t.activity)}</small><div class="why">${esc(mode==='off'?'Stage is off for this Coordinator process; work is human-controlled until re-enabled.':mode==='draining'&&!['running','waiting','claimed'].includes(t.state)?'Stage is draining; no new Ticket Sessions will start.':t.why||t.activity)}</div></button>`).join(''):'<div class="clear">No stage candidates</div>'}</section>`}).join('')}</div>`}
function pulse(){const ts=tickets(),fail=ts.filter(t=>['failed','retrying'].includes(t.state));const event= scenario==='degraded'?['WARN','#49 attempt 4 exited; retry retains session and workspace']:scenario==='exhausted'?['FAIL','#49 exhausted five attempts; unrelated work continues']:scenario==='draining'?['WARN','Discovery stopped; waiting for three active sessions']:scenario==='recovered'?['DONE','Recovered #49 from tracker, branch, worktree, and Pi session evidence']:scenario==='loading'?['INFO','Building startup eligibility snapshot; claiming is blocked']:scenario==='empty'?['DONE','Full scan complete; no eligible work']:['INFO','Tracker snapshot unchanged; next poll scheduled'];return `<div class="pulse"><section class="exception"><div class="panel-head">EXCEPTIONS FIRST</div>${fail.length?fail.map(t=>`<div class="exception-item">${badge(t.state)}<h3>${esc(t.ref)} · ${esc(t.title)}</h3><div class="muted">${esc(t.activity)} · attempt ${t.attempt}/5</div></div>`).join(''):'<div class="clear">CLEAR<br><small>No item requires attention</small></div>'}</section><section class="timeline"><div class="panel-head">RECENT COORDINATOR EVENTS</div><ol class="timeline-list"><li><time>14:32:26</time><b class="${event[0]==='FAIL'?'failed':event[0]==='DONE'?'settled':event[0]==='WARN'?'retrying':'muted'}">${event[0]}</b><span>${event[1]}</span></li><li><time>14:32:11</time><b class="settled">DONE</b><span>#63 left Auto-Triage after fresh tracker verification</span></li><li><time>14:31:47</time><b class="muted">INFO</b><span>PR #61 received Review Panel report 2 of 3</span></li><li><time>14:31:04</time><b class="muted">INFO</b><span>#57 focused validation started in isolated worktree</span></li></ol></section></div>`}
function sessionDrawer(){const t=tickets().find(x=>x.ref===detailRef);if(!t)return'';const hasSession=t.session!=='Not created';return `<div class="drawer-backdrop" role="dialog" aria-modal="true" aria-labelledby="drawer-title"><section class="drawer"><header class="drawer-head"><div><div class="eyebrow">${esc(t.stage)} · READ-ONLY ACTIVITY</div><h2 id="drawer-title">${esc(t.ref)} · ${esc(t.title)}</h2></div><button class="drawer-close" data-close-drawer aria-label="Close session activity">Close</button></header><div class="drawer-meta"><div><span>Lifecycle</span><strong>${badge(t.state)}</strong></div><div><span>Attempt</span><strong>${t.attempt}/5</strong></div><div><span>Session</span><strong>${esc(t.session)}</strong></div></div>${hasSession?`<div class="session-feed"><div class="attempt"><div class="attempt-head"><span>Attempt ${Math.max(1,t.attempt-1)} · persisted history</span><span>${t.attempt>1?'settled with retry':'initial context'}</span></div>${t.attempt>1?`<div class="feed-row error"><time>13:41:08</time><b>ERROR</b><p>Validation process exited 1; diagnostics and workspace were preserved.</p></div><div class="feed-row"><time>13:41:10</time><b>COORD</b><p>Scheduled retry against the existing Ticket Session and worktree.</p></div>`:`<div class="feed-row"><time>14:29:42</time><b>COORD</b><p>Created durable Ticket Session and recorded its file pointer.</p></div>`}</div><div class="attempt"><div class="attempt-head"><span>Attempt ${t.attempt} · current</span><span class="live-dot">● LIVE</span></div><div class="feed-row"><time>14:30:02</time><b>PI</b><p>Resumed with the complete issue contract and preserved prior history.</p></div><div class="feed-row tool"><time>14:30:31</time><b>TOOL</b><p>Read repository guidance and inspected the isolated workspace.</p></div><div class="feed-row"><time>14:31:04</time><b>PI</b><p>${esc(t.activity)}</p></div><div class="feed-row tool"><time>14:31:18</time><b>TOOL</b><p>Streaming structured activity to the Coordinator dashboard.</p></div></div></div>`:`<div class="no-session"><div><strong>No Ticket Session exists yet</strong><p>${esc(t.why||t.activity)}</p><p>The activity view will begin retaining process-local history when Automode dispatches this candidate.</p></div></div>`}</section></div>`}
function controls(){return `<div class="controls"><button class="control" data-action="inspect">Inspect selected session</button><button class="control" data-action="refresh">Refresh tracker snapshot</button><button class="control" data-action="drain">Stop discovery and drain</button><span class="notice" role="status">${esc(notice||'Force-stop remains a deliberate second Ctrl-C in the Main Session TUI.')}</span></div>`}
function render(){selected=Math.min(selected,Math.max(0,tickets().length-1));document.querySelector('#app').innerHTML=header()+`<div class="view">${variant==='deck'?deck():variant==='lanes'?lanes():pulse()}</div>`+controls()+sessionDrawer();document.querySelector('#variantLabel').textContent=variants.find(v=>v[0]===variant)[1];document.querySelector('#scenario').value=scenario;document.querySelectorAll('[data-select]').forEach(el=>el.onclick=()=>{selected=+el.dataset.select;render()});document.querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>action(el.dataset.action));document.querySelectorAll('[data-stage-toggle]').forEach(el=>el.onclick=()=>toggleStage(el.dataset.stageToggle));document.querySelectorAll('[data-card-ref]').forEach(el=>el.onclick=()=>{detailRef=el.dataset.cardRef;render()});document.querySelector('[data-close-drawer]')?.addEventListener('click',()=>{detailRef=null;render()});}
function updateUrl(){const u=new URL(location);u.searchParams.set('variant',variant);u.searchParams.set('state',scenario);history.replaceState({},'',u)}
function cycle(dir){let i=variants.findIndex(v=>v[0]===variant);variant=variants[(i+dir+variants.length)%variants.length][0];notice='';updateUrl();render()}
function action(a){if(a==='inspect'){const t=tickets()[selected];notice=t?`Open separately: pi --session ${t.session}`:'No Ticket Session available.'}if(a==='refresh'){scenario='loading';notice='Claims remain blocked until the fresh snapshot completes.'}if(a==='drain'){scenario='draining';notice='Discovery stopped; Ticket Sessions keep authority.'}updateUrl();render()}
function toggleStage(stage){const mode=stageModes[stage],hasActive=tickets().some(t=>t.stage===stage&&['running','waiting','claimed'].includes(t.state));if(mode==='on'){stageModes[stage]=hasActive?'draining':'off';notice=hasActive?`${stage} is draining; active Ticket Sessions may settle, and no new work will start.`:`${stage} is off; its candidates are now human-controlled.`}else{stageModes[stage]='on';notice=`${stage} is on; an immediate full eligibility scan was requested.`}render()}
document.querySelector('#previous').onclick=()=>cycle(-1);document.querySelector('#next').onclick=()=>cycle(1);const select=document.querySelector('#scenario');select.innerHTML=scenarios.map(s=>`<option>${s}</option>`).join('');select.onchange=e=>{scenario=e.target.value;notice='';updateUrl();render()};addEventListener('keydown',e=>{if(e.key==='Escape'&&detailRef){detailRef=null;render();return}if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1);if(e.key==='ArrowUp'||e.key==='ArrowDown'){const n=tickets().length;if(n){selected=(selected+(e.key==='ArrowDown'?1:-1)+n)%n;render()}e.preventDefault()}});render();
</script>
</body>
